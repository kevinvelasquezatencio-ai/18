<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Heydi</title>

<meta name="robots" content="noindex, nofollow, noarchive">

<style>

/* =========================================================
   GENERAL
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:20px;

    overflow:hidden;

    font-family:
        "Segoe UI",
        Arial,
        sans-serif;

    color:#f5f5f5;

    background:
        radial-gradient(
            circle at 50% 35%,
            rgba(226,183,65,.16),
            transparent 34%
        ),
        radial-gradient(
            circle at 10% 85%,
            rgba(255,180,70,.07),
            transparent 30%
        ),
        linear-gradient(
            145deg,
            #020202,
            #0a0907 50%,
            #020202
        );
}


/* =========================================================
   LÍNEAS DECORATIVAS
========================================================= */

.linea{
    position:absolute;

    width:750px;
    height:150px;

    border-radius:50%;

    border-top:
        1px solid
        rgba(232,193,76,.16);

    pointer-events:none;
}

.linea1{
    top:13%;
    left:-230px;

    transform:rotate(-25deg);
}

.linea2{
    bottom:7%;
    right:-250px;

    transform:rotate(-28deg);
}


/* =========================================================
   PARTÍCULAS
========================================================= */

.particula{
    position:absolute;

    width:3px;
    height:3px;

    border-radius:50%;

    background:#eacb73;

    box-shadow:
        0 0 10px
        rgba(234,203,115,.7);

    opacity:.25;

    pointer-events:none;

    animation:
        brillar 4s
        ease-in-out
        infinite;
}

@keyframes brillar{

    0%,100%{
        opacity:.12;
        transform:scale(.7);
    }

    50%{
        opacity:.75;
        transform:scale(1.4);
    }

}


/* =========================================================
   HOLA HEYDI
========================================================= */

.nombre{
    position:absolute;

    top:8%;

    width:100%;

    text-align:center;

    pointer-events:none;
}

.nombre small{
    display:block;

    color:#8f8060;

    font-size:9px;

    letter-spacing:5px;

    margin-bottom:10px;
}

.nombre h1{
    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size:
        clamp(
            42px,
            8vw,
            70px
        );

    font-weight:400;

    color:#f3f3f3;
}

.nombre h1 span{
    color:#efca62;

    text-shadow:
        0 0 30px
        rgba(239,202,98,.15);
}


/* =========================================================
   TARJETA PRINCIPAL
========================================================= */

.tarjeta{
    position:relative;

    z-index:10;

    width:min(
        460px,
        94vw
    );

    margin-top:75px;

    padding:
        38px 27px
        34px;

    text-align:center;

    border-radius:30px;

    border:
        1px solid
        rgba(255,255,255,.17);

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.085),
            rgba(255,255,255,.025)
        );

    backdrop-filter:
        blur(18px);

    -webkit-backdrop-filter:
        blur(18px);

    box-shadow:
        0 35px 90px
        rgba(0,0,0,.65),
        inset 0 1px 0
        rgba(255,255,255,.09);

    animation:
        entrada .9s ease;

    transition:
        border-color .5s ease,
        box-shadow .5s ease,
        background .5s ease;
}

@keyframes entrada{

    from{
        opacity:0;

        transform:
            translateY(25px)
            scale(.97);
    }

    to{
        opacity:1;

        transform:
            translateY(0)
            scale(1);
    }

}


/* =========================================================
   ICONO LLAVE
========================================================= */

.icono{
    width:54px;
    height:54px;

    margin:
        0 auto
        18px;

    display:flex;

    justify-content:center;
    align-items:center;

    border-radius:17px;

    border:
        1px solid
        rgba(238,202,98,.27);

    background:
        rgba(238,202,98,.055);

    color:#efcc65;

    font-size:23px;

    box-shadow:
        0 0 30px
        rgba(239,202,98,.08);

    transition:.5s ease;
}


/* =========================================================
   TEXTOS
========================================================= */

.tarjeta h2{
    font-size:
        clamp(
            27px,
            5vw,
            32px
        );

    font-weight:600;

    color:#f3f3f3;
}

.tarjeta h2 span{
    color:#efcc65;
}

.pista{
    margin-top:12px;

    color:#a89a73;

    font-size:11px;

    line-height:1.7;
}

.ayuda{
    margin-top:4px;

    color:#626262;

    font-size:10px;
}


/* =========================================================
   CUADROS DE LA CLAVE
========================================================= */

.codigo{
    display:flex;

    justify-content:center;

    gap:16px;

    margin-top:29px;
}

.codigo input{
    width:69px;
    height:73px;

    border-radius:18px;

    border:
        1px solid
        rgba(239,204,101,.35);

    outline:none;

    background:
        rgba(5,5,5,.72);

    color:#fff;

    text-align:center;

    font-size:28px;

    font-weight:600;

    caret-color:#efcc65;

    box-shadow:
        inset 0 0 20px
        rgba(0,0,0,.35);

    transition:
        border-color .25s ease,
        box-shadow .25s ease,
        transform .25s ease;
}

.codigo input:focus{
    border-color:#efcc65;

    transform:
        translateY(-2px);

    box-shadow:
        0 0 22px
        rgba(239,204,101,.12),
        inset 0 0 20px
        rgba(0,0,0,.4);
}


/* =========================================================
   BOTÓN
========================================================= */

.verificar{
    width:min(
        290px,
        100%
    );

    height:50px;

    margin-top:30px;

    border:0;

    border-radius:14px;

    cursor:pointer;

    font-size:12px;

    font-weight:700;

    letter-spacing:.8px;

    color:#161207;

    background:
        linear-gradient(
            90deg,
            #d5af30,
            #f2d768
        );

    box-shadow:
        0 10px 30px
        rgba(213,175,48,.10);

    transition:.25s ease;
}

.verificar:hover{
    transform:
        translateY(-2px);

    filter:
        brightness(1.07);
}

.verificar:disabled{
    cursor:default;

    transform:none;
}


/* =========================================================
   ESTADO
========================================================= */

#mensaje{
    min-height:28px;

    margin-top:18px;

    color:#777;

    font-size:11px;

    line-height:1.6;
}


/* =========================================================
   VERIFICANDO
   LOS CUADRITOS SE MUEVEN
========================================================= */

.tarjeta.verificando
.codigo input{

    animation:
        girarCuadro
        .65s
        ease-in-out
        infinite alternate;
}

.tarjeta.verificando
.codigo input:nth-child(2){

    animation-delay:.15s;
}


@keyframes girarCuadro{

    from{
        transform:
            rotate(-7deg)
            translateY(-2px);

        border-color:
            rgba(239,204,101,.30);
    }

    to{
        transform:
            rotate(7deg)
            translateY(3px);

        border-color:
            rgba(239,204,101,.75);

        box-shadow:
            0 0 24px
            rgba(239,204,101,.12);
    }

}


/* =========================================================
   SPINNER
========================================================= */

.spinner{
    width:17px;
    height:17px;

    display:inline-block;

    margin-right:8px;

    vertical-align:middle;

    border-radius:50%;

    border:
        2px solid
        rgba(20,20,20,.25);

    border-top-color:#18150c;

    animation:
        spin .7s
        linear
        infinite;
}

@keyframes spin{

    to{
        transform:
            rotate(360deg);
    }

}


/* =========================================================
   ERROR
========================================================= */

.tarjeta.error{

    border-color:
        rgba(255,79,79,.48);

    animation:
        errorShake .45s ease;
}

.tarjeta.error
.codigo input{

    border-color:#d95b5b;

    color:#ff8585;
}

.tarjeta.error
.icono{

    border-color:
        rgba(255,80,80,.35);

    color:#ff6969;

    background:
        rgba(255,70,70,.05);
}

@keyframes errorShake{

    0%,100%{
        transform:
            translateX(0);
    }

    25%{
        transform:
            translateX(-8px);
    }

    50%{
        transform:
            translateX(8px);
    }

    75%{
        transform:
            translateX(-4px);
    }

}


/* =========================================================
   ÉXITO
========================================================= */

.tarjeta.correcto{

    border-color:
        rgba(0,225,133,.42);

    background:
        radial-gradient(
            circle at 50% 35%,
            rgba(0,220,130,.10),
            transparent 45%
        ),
        linear-gradient(
            145deg,
            rgba(255,255,255,.075),
            rgba(255,255,255,.025)
        );

    box-shadow:
        0 35px 90px
        rgba(0,0,0,.65),
        0 0 55px
        rgba(0,220,125,.08);
}


/* =========================================================
   CHECK VERDE
========================================================= */

#pantallaCorrecta{
    display:none;

    text-align:center;

    padding:
        4px 0
        7px;
}

#pantallaCorrecta.visible{
    display:block;

    animation:
        aparecerCorrecto
        .65s ease;
}

@keyframes aparecerCorrecto{

    from{
        opacity:0;

        transform:
            scale(.85)
            translateY(10px);
    }

    to{
        opacity:1;

        transform:
            scale(1)
            translateY(0);
    }

}


.check-circulo{
    width:112px;
    height:112px;

    margin:
        3px auto
        23px;

    display:flex;

    justify-content:center;
    align-items:center;

    border-radius:50%;

    border:
        2px solid
        rgba(0,220,130,.55);

    background:
        rgba(0,220,130,.025);

    box-shadow:
        0 0 45px
        rgba(0,220,130,.10);

    animation:
        circuloCheck
        .7s ease;
}


@keyframes circuloCheck{

    0%{
        opacity:0;

        transform:
            scale(.45);
    }

    65%{
        transform:
            scale(1.08);
    }

    100%{
        opacity:1;

        transform:
            scale(1);
    }

}


.check{
    width:57px;
    height:57px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:17px;

    border:
        2px solid
        #00d77d;

    background:#0c0c0c;

    color:#fff;

    font-size:31px;

    font-weight:600;

    box-shadow:
        0 0 25px
        rgba(0,220,130,.17);

    animation:
        checkEntrada
        .65s
        .2s
        both;
}


@keyframes checkEntrada{

    from{
        opacity:0;

        transform:
            rotate(-20deg)
            scale(.6);
    }

    to{
        opacity:1;

        transform:
            rotate(0)
            scale(1);
    }

}


#pantallaCorrecta h3{

    font-size:24px;

    font-weight:600;

    color:#efefef;
}

#pantallaCorrecta h3 span{

    color:#00d77d;
}

#pantallaCorrecta p{

    margin-top:9px;

    color:#777;

    font-size:11px;
}


/* =========================================================
   CELULAR
========================================================= */

@media(max-width:500px){

    .nombre{
        top:7%;
    }

    .tarjeta{
        margin-top:75px;

        padding:
            33px 18px
            29px;
    }

    .codigo input{
        width:63px;
        height:68px;
    }

}

</style>

</head>


<body>


<div class="linea linea1"></div>
<div class="linea linea2"></div>


<!-- =========================================================
     NOMBRE
========================================================= -->

<div class="nombre">

    <small>
        A LITTLE SPACE ✦
    </small>

    <h1>
        Hola, <span>Heydi</span>
    </h1>

</div>



<!-- =========================================================
     TARJETA
========================================================= -->

<div
class="tarjeta"
id="tarjeta"
>


<!-- CONTENIDO DE CLAVE -->

<div id="contenidoClave">


    <div
    class="icono"
    id="icono"
    >
        🔑
    </div>


    <h2>
        Enter <span>Code</span>
    </h2>


    <div class="pista">

        La clave es una fecha
        muy especial. ✦

    </div>


    <div class="ayuda">
        Solo necesitas 2 números.
    </div>



    <div class="codigo">

        <input
            id="n1"
            type="tel"
            inputmode="numeric"
            maxlength="1"
            autocomplete="off"
        >

        <input
            id="n2"
            type="tel"
            inputmode="numeric"
            maxlength="1"
            autocomplete="off"
        >

    </div>



    <button
    class="verificar"
    id="btnVerificar"
    onclick="entrar()"
    >
        VERIFY CODE
    </button>


    <div id="mensaje">
        Digita los 2 números.
    </div>


</div>



<!-- =========================================================
     CHECK CORRECTO
========================================================= -->

<div id="pantallaCorrecta">


    <div class="check-circulo">

        <div class="check">
            ✓
        </div>

    </div>


    <h3>
        Access <span>Granted</span>
    </h3>


    <p>
        Código correcto. Todo listo.
    </p>


</div>


</div>



<script>

/* =========================================================
   ELEMENTOS
========================================================= */

const n1 =
document.getElementById("n1");

const n2 =
document.getElementById("n2");

const tarjeta =
document.getElementById("tarjeta");

const mensaje =
document.getElementById("mensaje");

const boton =
document.getElementById("btnVerificar");

const contenidoClave =
document.getElementById("contenidoClave");

const pantallaCorrecta =
document.getElementById(
    "pantallaCorrecta"
);



/* =========================================================
   SOLO NÚMEROS
========================================================= */

function limpiarNumero(input){

    input.value =
    input.value.replace(
        /\D/g,
        ""
    );

}



/* =========================================================
   PASAR AUTOMÁTICAMENTE
========================================================= */

n1.addEventListener(
"input",
function(){

    limpiarNumero(this);


    if(this.value.length === 1){

        n2.focus();

    }

});


n2.addEventListener(
"input",
function(){

    limpiarNumero(this);


    if(
        n1.value &&
        n2.value
    ){

        boton.focus();

    }

});



/* =========================================================
   RETROCEDER
========================================================= */

n2.addEventListener(
"keydown",
function(event){

    if(
        event.key === "Backspace" &&
        this.value === ""
    ){

        n1.focus();

    }

});



/* =========================================================
   ENTER
========================================================= */

document.addEventListener(
"keydown",
function(event){

    if(
        event.key === "Enter" &&
        contenidoClave.style.display
        !== "none"
    ){

        entrar();

    }

});



/* =========================================================
   VERIFICAR CLAVE
========================================================= */

function entrar(){

    const codigo =
    n1.value +
    n2.value;


    /* FALTAN NÚMEROS */

    if(
        codigo.length < 2
    ){

        mensaje.textContent =
        "Completa los 2 números.";

        return;

    }


    /* EMPIEZA VERIFICACIÓN */

    tarjeta.classList.remove(
        "error"
    );

    tarjeta.classList.add(
        "verificando"
    );


    n1.disabled =
    true;

    n2.disabled =
    true;

    boton.disabled =
    true;


    boton.innerHTML = `

        <span class="spinner"></span>
        VERIFYING...

    `;


    mensaje.textContent =
    "Verificando código...";


    /* PEQUEÑA ESPERA PARA VER LA ANIMACIÓN */

    setTimeout(()=>{


        tarjeta.classList.remove(
            "verificando"
        );


        /* =====================
           CORRECTO
        ===================== */

        if(
            codigo === "18"
        ){

            correcto();

        }


        /* =====================
           INCORRECTO
        ===================== */

        else{

            incorrecto();

        }


    },1600);

}



/* =========================================================
   CORRECTO
========================================================= */

function correcto(){

    tarjeta.classList.add(
        "correcto"
    );


    /* GUARDAMOS ACCESO */

    sessionStorage.setItem(
        "accesoHeydi",
        "si"
    );


    /* OCULTAMOS CLAVE */

    contenidoClave.style.display =
    "none";


    /* MOSTRAMOS CHECK */

    pantallaCorrecta.classList.add(
        "visible"
    );


    /* ENTRAR A INICIO */

    setTimeout(()=>{

        window.location.href =
        "inicio.html";

    },2300);

}



/* =========================================================
   INCORRECTO
========================================================= */

function incorrecto(){

    tarjeta.classList.add(
        "error"
    );


    mensaje.innerHTML = `

        Código incorrecto.
        <br>
        Inténtalo otra vez.

    `;


    boton.textContent =
    "TRY AGAIN";


    n1.disabled =
    false;

    n2.disabled =
    false;

    boton.disabled =
    false;


    setTimeout(()=>{

        n1.value =
        "";

        n2.value =
        "";

        n1.focus();

    },350);


    setTimeout(()=>{

        tarjeta.classList.remove(
            "error"
        );

    },900);

}



/* =========================================================
   PARTÍCULAS
========================================================= */

for(
let i=0;
i<28;
i++
){

    const particula =
    document.createElement(
        "span"
    );


    particula.className =
    "particula";


    const tamano =
    Math.random()*2.3+1;


    particula.style.width =
    tamano+"px";

    particula.style.height =
    tamano+"px";


    particula.style.left =
    Math.random()*100+"%";

    particula.style.top =
    Math.random()*100+"%";


    particula.style.animationDelay =
    Math.random()*5+"s";


    particula.style.animationDuration =
    (
        Math.random()*3+3
    )+"s";


    document.body.appendChild(
        particula
    );

}



/* =========================================================
   FOCUS
========================================================= */

window.addEventListener(
"load",
()=>{

    setTimeout(()=>{

        n1.focus();

    },650);

});

</script>

</body>
</html>
