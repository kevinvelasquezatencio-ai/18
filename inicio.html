<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ead9c5">
<title>Hola, Heydi ♡</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Great+Vibes&display=swap" rel="stylesheet">

<script>
if(sessionStorage.getItem("accesoHeydi") !== "si"){
  location.replace("index.html");
}
</script>

<style>
:root{
  --verde:#465f35;
  --verde-claro:#a9bb8c;
  --beige:#e9d5bb;
  --crema:#fff9f0;
  --texto:#435333;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  min-height:100vh;
  min-height:100svh;
  overflow-x:hidden;
  font-family:"DM Sans",sans-serif;
  color:var(--texto);
  background:
    radial-gradient(
      ellipse at 50% 45%,
      #fffaf0 0%,
      rgba(255,249,239,.72) 42%,
      transparent 83%
    ),
    linear-gradient(
      145deg,
      #e3c6a7,
      #f5e7d6 53%,
      #e3cab0
    );
}

/* FONDO Y DECORACIÓN */

.fondo{
  position:fixed;
  inset:0;
  overflow:hidden;
  z-index:0;
  pointer-events:none;
}

.onda{
  position:absolute;
  border-radius:50%;
}

.onda-izquierda{
  width:85vw;
  height:46vw;
  left:-38vw;
  bottom:-30vw;
  background:linear-gradient(
    135deg,
    rgba(211,170,129,.38),
    rgba(255,247,230,.16)
  );
}

.onda-superior{
  width:65vw;
  height:35vw;
  right:-34vw;
  top:-25vw;
  background:rgba(216,190,156,.21);
}

.curva{
  position:absolute;
  width:720px;
  height:440px;
  left:-10%;
  top:23%;
  border-radius:50%;
  border:1px solid rgba(133,126,91,.14);
  transform:rotate(-25deg);
}

/* ARQUITECTURA ORIGINAL */

.edificio{
  position:absolute;
  right:-1%;
  bottom:1%;
  width:min(680px,49vw);
  height:auto;
  opacity:.34;
  filter:saturate(.75);

  -webkit-mask-image:linear-gradient(
    to right,
    transparent,
    black 24%,
    black 100%
  );

  mask-image:linear-gradient(
    to right,
    transparent,
    black 24%,
    black 100%
  );

  animation:aparecerEdificio 1.8s ease both;
}

@keyframes aparecerEdificio{
  from{
    opacity:0;
    transform:translateX(25px);
  }
  to{
    opacity:.34;
    transform:translateX(0);
  }
}

.lineas-izquierda{
  position:absolute;
  left:0;
  top:0;
  width:300px;
  height:245px;
  opacity:.28;
}

.lineas-izquierda path{
  fill:none;
  stroke:#46483b;
  stroke-width:1.2;
  stroke-linecap:round;
}

/* DETALLES LUMINOSOS */

.brillo{
  position:absolute;
  width:5px;
  height:5px;
  border-radius:50%;
  background:#fff1c3;
  box-shadow:0 0 13px 5px rgba(255,231,153,.56);
  animation:brillar 4s ease-in-out infinite alternate;
}

@keyframes brillar{
  from{
    opacity:.25;
    transform:scale(.6);
  }
  to{
    opacity:1;
    transform:scale(1.3);
  }
}

/* CONTENIDO */

.contenedor{
  position:relative;
  z-index:2;
  width:min(1400px,100%);
  min-height:100svh;
  margin:auto;
  padding:30px 22px 65px;
}

/* SALUDO */

.encabezado{
  text-align:center;
  margin-bottom:25px;
  animation:entrada .9s ease both;
}

.encabezado h1{
  font-family:"Great Vibes",cursive;
  font-size:clamp(52px,7vw,79px);
  line-height:1.2;
  font-weight:400;
  color:#42592f;
  text-shadow:0 7px 22px rgba(65,82,43,.08);
}

/* MENÚ LIQUID GLASS */

.menu{
  display:flex;
  align-items:center;
  gap:5px;
  width:min(1160px,100%);
  margin:0 auto;
  padding:9px;
  border:2px solid rgba(255,255,255,.9);
  border-radius:70px;

  background:linear-gradient(
    120deg,
    rgba(255,255,255,.64),
    rgba(255,249,239,.39)
  );

  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);

  box-shadow:
    0 18px 40px rgba(112,80,45,.14),
    inset 0 2px 13px rgba(255,255,255,.6);

  animation:entrada 1s .1s both;
}

.menu a{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:7px;
  padding:16px 5px;
  border-radius:55px;
  text-decoration:none;
  color:#35462b;
  font-size:13px;
  font-weight:500;

  transition:
    transform .3s ease,
    background .35s ease,
    box-shadow .35s ease;
}

.menu a svg{
  width:25px;
  height:25px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
  transition:transform .3s ease;
}

.menu a.activo{
  background:linear-gradient(
    135deg,
    #c5d3a9,
    #98b37b
  );

  box-shadow:
    inset 0 2px 9px rgba(255,255,255,.65),
    0 6px 20px rgba(86,111,59,.17);
}

.menu a:hover{
  transform:translateY(-3px);
  background:rgba(175,193,146,.35);
  box-shadow:0 8px 23px rgba(75,105,52,.12);
}

.menu a:hover svg{
  transform:scale(1.13);
}

.menu a.activo:hover{
  background:linear-gradient(
    135deg,
    #c5d3a9,
    #98b37b
  );
}

.menu a:focus-visible{
  outline:2px solid var(--verde);
  outline-offset:3px;
}

/* BIENVENIDA */

.bienvenida{
  min-height:55vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  padding:45px 20px 90px;
  text-align:center;
  animation:entrada 1s .3s both;
}

.mini{
  font-size:10px;
  letter-spacing:5px;
  color:#758662;
}

.corazon{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:20px;
  margin:28px auto;
  font-size:26px;
  color:#91a276;
  animation:latir 4s ease-in-out infinite;
}

.corazon::before,
.corazon::after{
  content:"";
  width:85px;
  height:1px;
  background:linear-gradient(
    90deg,
    transparent,
    #a7b18f
  );
}

.corazon::after{
  transform:rotate(180deg);
}

.bienvenida p{
  max-width:620px;
  font-size:clamp(15px,1.8vw,18px);
  line-height:2;
  color:#766b5a;
}

.nota{
  margin-top:31px;
  font-family:Georgia,serif;
  font-size:15px;
  font-style:italic;
  color:#7b8b65;
}

/* ANIMACIONES */

@keyframes entrada{
  from{
    opacity:0;
    transform:translateY(25px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

@keyframes latir{
  0%,100%{opacity:.72;}
  50%{opacity:1;}
}

/* CELULAR */

@media(max-width:700px){
  .contenedor{
    padding:24px 12px 45px;
  }

  .encabezado{
    margin-bottom:18px;
  }

  .encabezado h1{
    font-size:60px;
  }

  .menu{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    border-radius:28px;
    padding:7px;
  }

  .menu a{
    font-size:11px;
    padding:12px 4px;
    gap:5px;
  }

  .menu a svg{
    width:22px;
    height:22px;
  }

  .bienvenida{
    min-height:50vh;
    padding:50px 15px 80px;
  }

  .bienvenida p{
    font-size:15px;
  }

  .lineas-izquierda{
    width:140px;
    height:140px;
    opacity:.2;
  }

  .edificio{
    width:83vw;
    right:-24%;
    bottom:7%;
    opacity:.22;
    animation:none;
  }

  .curva{
    left:-100%;
  }
}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation:none!important;
    transition:none!important;
  }
}
</style>
</head>

<body>

<!-- FONDO ORIGINAL -->

<div class="fondo">

  <img

    <path d="M0 210 Q110 95 300 5"/>

    <path d="M55 46 H190 V175 H55 Z"

  </svg>

  <div class="brillo"

<!-- =====================================
     MÚSICA AUTOMÁTICA DEL MENÚ

     AQUÍ ESTÁ TU CANCIÓN:
     musica2.mp3

     NO HAY BOTÓN VISIBLE
===================================== -->

<audio
  id="musicaMenu"
  src="musica2.mp3.mp3"
  preload="auto"
  autoplay
  loop
></audio>

<!-- PÁGINA PRINCIPAL -->

<main class="contenedor">

  <header class="encabezado">
    <h1>Hola, Heydi ♡</h1>
  </header>

  <!-- MENÚ ORIGINAL -->

  <nav class="menu" aria-label="Menú principal">

    <a href="inicio.html"
       class="activo"
       aria-current="page">
      <svg viewBox="0 0 24 24">
        <path d="m3 10 9-7 9 7v10H3z"/>
        <path d="M9 20v-7h6v7"/>
      </svg>
      Inicio
    </a>

    <a href="planta.html">
      <svg viewBox="0 0 24 24">
        <path d="M12 22V10"/>
        <path d="M12 14C4 14 3 8 3 5c6 0 9 2 9 9z"/>
        <path d="M12 11c0-6 4-8 9-8 0 6-3 9-9 9"/>
      </svg>
      Planta
    </a>

    <a href="video.html">
      <svg viewBox="0 0 24 24">
        <rect x="2" y="4"
              width="20" height="16" rx="4"/>
        <path d="m10 8 6 4-6 4z"/>
      </svg>

      <svg viewBox="0 0 24 24">

      </svg>
      Abrazo

      </svg>

    <a href="estrellada.html">
      <svg viewBox="0 0 24 24">
        <path d="M20 15.8A9 9 0 0 1 8.2 4a9 9 0 1 0 11.8 11.8z"/>
        <path d="m17 3 .6 2.4L20 6l-2.4.6L17 9l-.6-2.4L14 6l2.4-.6z"/>
      </svg>

  </nav>

  <!-- BIENVENIDA ORIGINAL -->

  <section class="bienvenida">

    <div class="mini">

    </div>

    <div class="corazon">♡</div>

    <p>
      Qué bonito saber que pasaste por aquí.<br>

    </p>

    <div class="nota">
      Disfrútalo a tu ritmo. ♡
    </div>

  </section>

</main>

<script>
"use strict";

/* =========================================
   MÚSICA AUTOMÁTICA DEL MENÚ
   musica2.mp3
========================================= */

const musicaMenu =
  document.getElementById("musicaMenu");

const CLAVE_MUSICA =
  "heydi_musica_menu_auto_v1";

const VOLUMEN = 0.35;

musicaMenu.volume = VOLUMEN;

/* RECUPERAR SEGUNDO GUARDADO */

function recuperarTiempo(){
  try{
    const datos = JSON.parse(
      sessionStorage.getItem(CLAVE_MUSICA)
    );

    return Number.isFinite(datos?.tiempo)
      ? Math.max(0,datos.tiempo)
      : 0;

  }catch{
    return 0;
  }
}

let tiempoGuardado = recuperarTiempo();

/* RESTAURAR LA CANCIÓN */

function restaurarTiempo(){
  if(!Number.isFinite(tiempoGuardado)) return;

  try{
    const duracion = musicaMenu.duration;

    musicaMenu.currentTime =
      Number.isFinite(duracion) && duracion>0
      ? tiempoGuardado % duracion
      : tiempoGuardado;

  }catch(error){
    // Se reintentará cuando cargue el audio.
  }
}

/* GUARDAR EL SEGUNDO ACTUAL */

function guardarTiempo(){
  if(Number.isFinite(musicaMenu.currentTime)){
    tiempoGuardado = musicaMenu.currentTime;
  }

  sessionStorage.setItem(
    CLAVE_MUSICA,
    JSON.stringify({
      tiempo:tiempoGuardado
    })
  );
}

/* REPRODUCIR AUTOMÁTICAMENTE */

let intentando = false;

async function iniciarMusica(){
  if(intentando || !musicaMenu.paused) return;

  intentando = true;

  try{
    musicaMenu.volume = VOLUMEN;
    await musicaMenu.play();
  }catch(error){
    /*
      El navegador puede bloquear el sonido
      hasta la primera interacción del usuario.
    */
  }finally{
    intentando = false;
  }
}

/* AL CARGAR EL MP3 */

musicaMenu.addEventListener(
  "loadedmetadata",
  ()=>{
    restaurarTiempo();
    iniciarMusica();
  }
);

/* AL ENTRAR A LA PÁGINA */

window.addEventListener("load",()=>{
  restaurarTiempo();
  iniciarMusica();
});

/* PRIMERA INTERACCIÓN SI AUTOPLAY FALLA */

function activarConInteraccion(){
  if(musicaMenu.paused){
    iniciarMusica();
  }
}

document.addEventListener(
  "pointerdown",
  activarConInteraccion,
  {capture:true}
);

document.addEventListener(
  "keydown",
  activarConInteraccion,
  {capture:true}
);

/* GUARDAR CADA SEGUNDO */

musicaMenu.addEventListener(
  "timeupdate",
  guardarTiempo
);

/* PAUSAR AL ENTRAR EN UN DETALLE */

document.querySelectorAll(
  '.menu a[href]:not([href="inicio.html"])'
).forEach(enlace=>{

  enlace.addEventListener("click",()=>{
    guardarTiempo();
    musicaMenu.pause();
  });

});

/* GUARDAR Y PAUSAR AL SALIR */

window.addEventListener("pagehide",()=>{
  guardarTiempo();
  musicaMenu.pause();
});

/* SI REGRESA CON EL BOTÓN ATRÁS */

window.addEventListener("pageshow",evento=>{
  if(evento.persisted){
    tiempoGuardado = recuperarTiempo();
    restaurarTiempo();
    iniciarMusica();
  }
});

</script>

</body>
</html>
